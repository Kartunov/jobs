<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека тренера</title>
    <link rel="stylesheet" href="style.css">
    <!-- Скрипт для мгновенного применения темы до отрисовки страницы -->
    <script>
        const savedTheme = localStorage.getItem('appTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

<div class="library-container">
    <div class="library-header">
        <h1 class="library-title">Панель управления</h1>
        
        <div style="display: flex; gap: 20px; align-items: center;">
            <!-- Переключатель тем -->
            <div class="theme-switcher" id="theme-switcher">
                <div class="theme-btn" data-theme-val="light" title="Светлая"></div>
                <div class="theme-btn" data-theme-val="dark" title="Темная"></div>
                <div class="theme-btn" data-theme-val="blue-purple" title="Сине-фиолетовая"></div>
                <div class="theme-btn" data-theme-val="black-orange" title="Черно-оранжевая"></div>
            </div>

            <!-- Авторизация -->
            <div id="auth-container">
                <span style="color: var(--text-muted); font-size: 14px;">Загрузка...</span>
            </div>
        </div>
    </div>

    <h2 style="font-size: 16px; margin-bottom: 15px; font-weight: normal; color: var(--text-muted);">Инструменты</h2>
    
    <div class="folders-grid">
        <a href="library.html" class="folder-card">
            <div class="folder-icon">📚</div>
            <div class="folder-name">Справочник упражнений</div>
            <div class="folder-stats">База упражнений по группам мышц</div>
        </a>

        <a href="table.html" class="folder-card">
            <div class="folder-icon">📝</div>
            <div class="folder-name">Редактор программ</div>
            <div class="folder-stats">Конструктор тренировок и циклов</div>
        </a>
    </div>
</div>

<!-- ПОДКЛЮЧАЕМ FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCU418F9p5qxpEFIeHGNSQD17z155Tqtf8",
    authDomain: "jobs-38388.firebaseapp.com",
    projectId: "jobs-38388",
    storageBucket: "jobs-38388.firebasestorage.app",
    messagingSenderId: "70186867403",
    appId: "1:70186867403:web:cf5d3fc9580eb03c14194e",
    measurementId: "G-CEC7XCNZ1K"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const authContainer = document.getElementById('auth-container');

  function updateUI(user) {
    if (user) {
      authContainer.innerHTML = `
        <div class="user-profile">
          <img src="${user.photoURL || 'https://via.placeholder.com/30'}" alt="Avatar" class="user-avatar">
          <span>${user.displayName || user.email}</span>
          <button class="btn-logout" id="logout-btn">Выйти</button>
        </div>
      `;
      document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    } else {
      authContainer.innerHTML = `<button class="btn-add" id="login-btn">Войти через Google</button>`;
      document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
    }
  }

  onAuthStateChanged(auth, updateUI);
</script>

<!-- СКРИПТ ДЛЯ ПЕРЕКЛЮЧЕНИЯ ТЕМ -->
<script>
    const themeBtns = document.querySelectorAll('.theme-btn');
    
    // Устанавливаем активную кнопку при загрузке
    function updateActiveBtn(theme) {
        themeBtns.forEach(btn => {
            if (btn.getAttribute('data-theme-val') === theme) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    let currentTheme = localStorage.getItem('appTheme') || 'light';
    updateActiveBtn(currentTheme);

    // Обработчик кликов
    themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const theme = btn.getAttribute('data-theme-val');
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('appTheme', theme);
            updateActiveBtn(theme);
        });
    });
</script>

</body>
</html>
