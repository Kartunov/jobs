<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор программ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script>
        const savedTheme = localStorage.getItem('appTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        /* Специфичные стили, которые не зависят от темы */
        .layout { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; height: 95vh; width: 100%; overflow: hidden; }
        .left-panel { flex: 0 0 60%; overflow-y: auto; padding-right: 10px; }
        .right-panel { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: flex-start; padding: 0 10px; overflow-y: auto; overflow-x: hidden;}
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        
        /* Стили для timeline */
        .timeline-section { padding: 10px; margin-bottom: 10px; overflow-x: auto; }
        .timeline-table { min-width: 500px; table-layout: fixed;}
        .timeline-name-input { font-weight: bold; text-align: center; border: 1px solid transparent; background: transparent; width: 100%; outline: none; font-size: 12px; }
        .timeline-sub-input { text-align: center; border: 1px solid transparent; background: transparent; width: 100%; outline: none; font-size: 11px; }
        .timeline-desc-input { text-align: left; border: 1px solid transparent; background: transparent; width: 100%; outline: none; font-size: 11px; resize: vertical; min-height: 40px;}
        .timeline-del-btn { background: transparent; color: var(--danger); border: none; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0; float: right; line-height:1; }
        
        .bg-color-0 { background-color: rgba(52, 152, 219, 0.1); }
        .bg-color-1 { background-color: rgba(243, 156, 18, 0.1); }
        .bg-color-2 { background-color: rgba(46, 204, 113, 0.1); }
        .bg-color-3 { background-color: rgba(155, 89, 182, 0.1); }
        .bg-color-4 { background-color: rgba(231, 76, 60, 0.1); }

        .pm-section { padding: 10px; margin-bottom: 10px; }
        .pm-table input, .pm-table select { width: 100%; border: 1px solid var(--border-color); text-align: center; }
        
        .cycle-block { padding: 10px; margin-bottom: 15px; }
        .cycle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .cycle-title-wrapper { display: flex; align-items: center; gap: 8px; }
        .cycle-title-input { font-size: 15px; font-weight: bold; border: 1px solid transparent; background: transparent; padding: 2px 5px; width: 200px; outline: none; }
        .cycle-title-input:focus { border-color: var(--primary); }

        .week-block { background: var(--bg-body); border-radius: 4px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .week-title-wrapper { display: flex; align-items: center; gap: 8px; }
        .week-name-input { font-size: 13px; font-weight: bold; border: 1px solid transparent; background: transparent; padding: 2px 5px; width: 150px; outline: none; }
        .week-name-input:focus { border-color: var(--primary); }
        .week-summary { display: flex; gap: 10px; font-weight: bold; font-size: 12px; background: var(--bg-card); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color);}
        .week-summary span { color: var(--primary); }

        .workout-block { padding: 10px; margin-bottom: 10px; }
        .workout-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .workout-title-input { font-size: 13px; font-weight: bold; border: 1px solid transparent; background: transparent; padding: 2px 5px; width: 150px; outline: none; }
        .workout-title-input:focus { border-color: var(--primary); }

        .scroll-sets { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
        .set-block { display: flex; flex-direction: column; align-items: center; background: var(--bg-card); padding: 5px; border-radius: 6px; border: 1px dashed var(--border-color); min-width: 60px; }
        .set-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
        .input-set { width: 35px; padding: 3px; text-align: center; font-size: 11px; }
        .input-ex { width: 100px; padding: 4px; text-align: center; font-size: 12px; }
        .ex-comment { width: 120px; text-align: left; font-size: 11px; }
        
        .calc-cell { font-weight: bold; font-size: 12px; color: var(--primary); }
        
        .set-percent { font-size: 10px; font-weight: bold; padding: 2px; margin-top: 4px; border-radius: 3px; background: var(--bg-body); }
        .set-inactive { opacity: 0.5; border-style: solid; }
        
        /* Цвета интенсивности (оставляем их статичными, чтобы всегда было понятно) */
        .set-green { border: 1px solid #2ecc71; background-color: rgba(46, 204, 113, 0.1); }
        .set-green .set-percent { color: #2ecc71; background: rgba(46, 204, 113, 0.2); }
        .set-yellow { border: 1px solid #f1c40f; background-color: rgba(241, 196, 15, 0.1); }
        .set-yellow .set-percent { color: #d35400; background: rgba(241, 196, 15, 0.2); }
        .set-orange { border: 1px solid #e67e22; background-color: rgba(230, 126, 34, 0.1); }
        .set-orange .set-percent { color: #e67e22; background: rgba(230, 126, 34, 0.2); }
        .set-red { border: 1px solid #e74c3c; background-color: rgba(231, 76, 60, 0.1); }
        .set-red .set-percent { color: #e74c3c; background: rgba(231, 76, 60, 0.2); }
        .set-black { border: 1px solid #2c3e50; background-color: rgba(44, 62, 80, 0.1); }
        .set-black .set-percent { color: #fff; background: #2c3e50; }

        .hidden { display: none !important; }
        .collapse-icon { font-size: 10px; color: var(--text-muted); cursor: pointer; }

        .trend-indicator { font-size: 10px; margin-left: 3px; cursor: help; }
        .trend-up { color: #27ae60; }
        .trend-down { color: #c0392b; }

        .save-status { font-size: 12px; color: var(--success); margin-right: 15px; display: none;}
        .chart-header { padding: 10px; font-weight: bold; cursor: pointer; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; background: var(--bg-header); border-radius: 8px 8px 0 0; }
        .chart-body { padding: 15px; display: none; }
        .chart-body.active { display: block; animation: fadeIn 0.3s ease; }
        .chart-controls { display: flex; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 5px;}
        .metric-toggles { display: flex; background: var(--bg-body); border-radius: 4px; padding: 2px;}
        .metric-btn { background: transparent; color: var(--text-muted); padding: 2px 8px; font-size: 11px; border-radius: 3px;}
        .metric-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow);}
        .canvas-wrapper { position: relative; height: 200px; }
        .chart-select { width: 100%; margin-bottom: 10px; padding: 5px; }

        @media (max-width: 900px) {
            .layout { flex-direction: column; height: auto; overflow: visible; }
            .left-panel, .right-panel { flex: none; width: 100%; overflow: visible; padding: 0; }
            .right-panel { margin-top: 20px; }
            .top-nav { flex-direction: column; gap: 10px; }
            .input-ex, .input-set, .ex-comment, .pm-name, .pm-val { font-size: 16px !important; padding: 6px !important; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="#" id="back-btn" class="btn-link" style="padding: 5px 10px;">← Назад</a>
    <input type="text" id="program-title" class="program-title-input" placeholder="Название программы..." value="Загрузка..." style="font-size: 16px; font-weight: bold; border: 1px solid transparent; background: transparent; text-align: center; width: 300px; outline: none;">
    <div style="display: flex; align-items: center;">
        <span id="save-indicator" class="save-status">Сохранено ☁️</span>
        <button class="btn-add" onclick="exportToWord()">📄 Word</button>
        <button class="btn-add" onclick="exportToJSON()" style="background: #f39c12;">💾 JSON</button>
        <button class="btn-add" onclick="document.getElementById('import-json').click()" style="background: #3498db;">📂 Загрузить</button>
        <input type="file" id="import-json" accept=".json" style="display: none;" onchange="importFromJSON(event)">
    </div>
</div>

<div class="layout">
    <div class="left-panel">
        <div class="pm-section">
            <div>
                <div style="font-weight:bold; margin-bottom:5px; font-size:11px; color: var(--text-muted);">ПМ (кг)</div>
                <table class="pm-table" id="pmTable">
                    <thead><tr><th>УПР</th><th>ПМ</th><th></th></tr></thead>
                    <tbody id="pmTbody"></tbody>
                </table>
                <button class="btn-add" style="margin-top: 5px;" onclick="addPmRow()">+ Добавить ПМ</button>
            </div>
        </div>

        <div class="timeline-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div style="font-weight:bold; font-size:11px; color: var(--text-muted);">Структура макроцикла (Периоды)</div>
                <button class="btn-add" style="padding: 2px 8px; font-size: 11px;" onclick="addPeriodColumn()">+ Добавить период</button>
            </div>
            <table class="timeline-table" id="timelineTable">
                <tbody><tr id="timelineNamesRow"></tr><tr id="timelineSubRow"></tr><tr id="timelineDescRow"></tr></tbody>
            </table>
        </div>

        <div id="cyclesContainer"></div>
        <button class="btn-cycle" onclick="addNewCycle()">+ Создать новый цикл (макро/мезо)</button>
    </div>

    <div class="right-panel">
        <div style="width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px;">
            <div class="chart-block">
                <div class="chart-header" onclick="toggleChart('chart-ex-body', this)">
                    <span>🏋️‍♂️ Динамика упражнения</span>
                    <span class="collapse-icon">►</span>
                </div>
                <div class="chart-body" id="chart-ex-body">
                    <select class="chart-select" id="ex-chart-select" onchange="renderCharts()">
                        <option value="">Выберите упражнение из ПМ...</option>
                    </select>
                    <div class="chart-controls">
                        <div class="metric-toggles" id="ex-metric-toggles">
                            <button class="metric-btn active" data-metric="kpsh">КПШ</button>
                            <button class="metric-btn active" data-metric="oi">ОИ</button>
                            <button class="metric-btn active" data-metric="ot">ОТ</button>
                        </div>
                        <label style="font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="ex-show-weeks" onchange="renderCharts()"> Пунктир (недели)
                        </label>
                    </div>
                    <div class="canvas-wrapper"><canvas id="chart-exercise"></canvas></div>
                </div>
            </div>

            <div class="chart-block">
                <div class="chart-header" onclick="toggleChart('chart-workout-body', this)">
                    <span>📊 Сумма за тренировку</span>
                    <span class="collapse-icon">►</span>
                </div>
                <div class="chart-body" id="chart-workout-body">
                    <div class="chart-controls">
                        <div class="metric-toggles" id="wo-metric-toggles">
                            <button class="metric-btn active" data-metric="kpsh">КПШ</button>
                            <button class="metric-btn active" data-metric="oi">ОИ</button>
                            <button class="metric-btn active" data-metric="ot">ОТ</button>
                        </div>
                        <label style="font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="wo-show-weeks" onchange="renderCharts()"> Пунктир (недели)
                        </label>
                    </div>
                    <div class="canvas-wrapper"><canvas id="chart-workout"></canvas></div>
                </div>
            </div>

            <div class="chart-block">
                <div class="chart-header" onclick="toggleChart('chart-week-body', this)">
                    <span>📅 Сумма за неделю</span>
                    <span class="collapse-icon">►</span>
                </div>
                <div class="chart-body" id="chart-week-body">
                    <div class="chart-controls">
                        <div class="metric-toggles" id="week-metric-toggles">
                            <button class="metric-btn active" data-metric="kpsh">КПШ</button>
                            <button class="metric-btn active" data-metric="oi">ОИ</button>
                            <button class="metric-btn active" data-metric="ot">ОТ</button>

                        <label style="font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 5px;">

                        </label>

            <div class="chart-block">
                <div class="chart-header" onclick="toggleChart('chart-zones-body', this)">
                    <span>🎯 Зоны интенсивности (КПШ)</span>

                </div>
                <div class="chart-body" id="chart-zones-body">

                    <select class="chart-select" id="zone-chart-select" onchange="renderZoneCharts()">
                        <option value="">Выберите упражнение...</option>
                    </select>
                    <div class="canvas-wrapper" style="height: 150px;"><canvas id="chart-zone-ex"></canvas></div>
                    
                    <div style="font-size:12px; margin-bottom:5px; margin-top: 15px; font-weight:bold; text-align: center;">Все упражнения (с ПМ)</div>

                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCU418F9p5qxpEFIeHGNSQD17z155Tqtf8",
    authDomain: "jobs-38388.firebaseapp.com",
    projectId: "jobs-38388",
    storageBucket: "jobs-38388.firebasestorage.app",
    messagingSenderId: "70186867403",
    appId: "1:70186867403:web:cf5d3fc9580eb03c14194e",
    measurementId: "G-CEC7XCNZ1K"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const clientId = urlParams.get('clientId');
  const programId = urlParams.get('programId');
  
  let currentUser = null;
  let isDataLoaded = false;

  const backBtn = document.getElementById('back-btn');
  const programTitleInput = document.getElementById('program-title');
  const saveIndicator = document.getElementById('save-indicator');

  if (clientId) backBtn.href = `client.html?id=${clientId}`;
  else backBtn.href = `index.html`;

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user && clientId && programId) {
        await loadProgramFromCloud();
    } else if (!clientId) {
        programTitleInput.value = "Черновик";
        programTitleInput.disabled = true;
        loadFromLocalStorage();
        isDataLoaded = true;
    }
  });

  async function loadProgramFromCloud() {
    try {
        const docRef = doc(db, "users", currentUser.uid, "clients", clientId, "programs", programId);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            const data = docSnap.data();
            programTitleInput.value = data.title || "Без названия";
            if (data.data) renderState(data.data);
            else createEmptyTemplate();
        }
    } catch (e) { console.error("Ошибка загрузки: ", e); } 
    finally { isDataLoaded = true; }
  }

  let saveTimeout;
  window.triggerCloudSave = () => {
      if (!isDataLoaded || !currentUser || !clientId || !programId) return;
      saveIndicator.textContent = "Сохранение... ⏳";
      saveIndicator.style.display = "inline";
      saveIndicator.style.color = "#e67e22";
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
          try {
              const state = getCurrentState();
              const docRef = doc(db, "users", currentUser.uid, "clients", clientId, "programs", programId);
              await setDoc(docRef, { title: programTitleInput.value, data: state, updatedAt: new Date() }, { merge: true });
              saveIndicator.textContent = "Сохранено ☁️";
              saveIndicator.style.color = "#27ae60";
              setTimeout(() => { saveIndicator.style.display = "none"; }, 2000);
          } catch (e) {
              saveIndicator.textContent = "Ошибка ❌";
              saveIndicator.style.color = "#e74c3c";
          }
      }, 1500);
  };

  document.addEventListener('input', () => { if(isDataLoaded) triggerCloudSave(); });
  document.addEventListener('change', () => { if(isDataLoaded) triggerCloudSave(); });
  document.addEventListener('click', () => { if(isDataLoaded) setTimeout(triggerCloudSave, 50); });
</script>

<!-- ОСНОВНОЙ СКРИПТ -->
<script>
    let globalCycleCounter = 0, globalWeekCounter = 0, globalWorkoutCounter = 0, globalExCounter = 0, globalPeriodCounter = 0;
    let dictionary = {}; 

    function loadDictionaryData() {
        const savedDict = localStorage.getItem('trainerDictionary');
        if (savedDict) dictionary = JSON.parse(savedDict);
        else dictionary = { "Спина": ["Становая тяга", "Наклоны", "Румынская тяга", "Подтягивания", "Тяга к поясу", "Тяга к груди", "Тяга верхнего блока", "Тяга горизонтального блока", "Гиперэкстензия", "Пуловер", "Шраги", "Обратная планка"], "Ноги": ["Приседания", "Жим ногами", "Приседания в Гакке", "Выпады", "Разгибания на тренажёре", "Сгибания на тренажёре"], "Грудные": ["Жим штанги", "Жим гантелей", "Бабочка", "Разведение гантелей", "Пуловер"], "Руки": ["Отжимания на брусьях", "Французский жим", "Разгибание руки на лавке", "Разгибания на блоке", "Обратные отжимания", "Сгибания со снарядами", "Сгибания на блоке"], "Плечи": ["Армейский жим", "Жим гантелей", "Жим Арнольда", "Махи на передний пучок", "Махи на задний пучок", "Махи на средний пучок"], "Пресс": ["Скручивания", "Обратные скручивания", "Скручивания в упоре", "Скручивания в стороны", "Планка"], "Ягодицы": ["Приседания", "Румынская тяга", "Ягодичный мостик", "Отведение ноги в кроссовере", "Болгарские выпады", "Сведение в тренажёре", "Разведение в тренажёре"], "Кардио": ["Бег", "Ходьба", "Велотренажёр", "Гребля"] };
    }

    function getSelectOptions(selectedValue = '') {
        let options = `<option value="">-- Выбрать --</option>`;
        for (const [group, exList] of Object.entries(dictionary)) {
            options += `<optgroup label="${group}">`;
            exList.forEach(ex => { options += `<option value="${ex}" ${(ex === selectedValue) ? 'selected' : ''}>${ex}</option>`; });
            options += `</optgroup>`;
        }
        if (selectedValue && !Object.values(dictionary).flat().includes(selectedValue)) {
            options += `<optgroup label="Сохраненные"><option value="${selectedValue}" selected>${selectedValue}</option></optgroup>`;
        }
        return options;
    }

    function getCurrentState() {
        const state = { cycles: [], periods: [] };
        const pmData = [];
        document.querySelectorAll('#pmTbody tr').forEach(tr => { pmData.push({ name: tr.querySelector('.pm-name').value, val: tr.querySelector('.pm-val').value }); });
        state.pm = pmData;

        const timelineNames = document.getElementById('timelineNamesRow');
        if (timelineNames.children.length > 0 && !timelineNames.children[0].classList.contains('empty-placeholder')) {
            for (let i = 0; i < timelineNames.children.length; i++) {
                state.periods.push({ name: timelineNames.children[i].querySelector('input').value, sub: document.getElementById('timelineSubRow').children[i].querySelector('input').value, desc: document.getElementById('timelineDescRow').children[i].querySelector('textarea').value });
            }
        }

        document.querySelectorAll('.cycle-block').forEach(cycle => {
            const cycleData = { title: cycle.querySelector('.cycle-title-input').value, weeks: [] };
            cycle.querySelectorAll('.week-block').forEach(week => {
                const weekData = { title: week.querySelector('.week-name-input').value, workouts: [] };
                week.querySelectorAll('.workout-block').forEach(workout => {
                    const workoutData = { title: workout.querySelector('.workout-title-input').value, exercises: [] };
                    workout.querySelectorAll('.workout-tbody tr').forEach(tr => {
                        const exData = { name: tr.querySelector('.ex-name').value, comment: tr.querySelector('.ex-comment') ? tr.querySelector('.ex-comment').value : '', sets: [] };
                        tr.querySelectorAll('.set-block').forEach(set => { exData.sets.push({ weight: set.querySelector('.set-weight').value, sets: set.querySelector('.set-sets').value, reps: set.querySelector('.set-reps').value }); });
                        workoutData.exercises.push(exData);
                    });
                    weekData.workouts.push(workoutData);
                });
                cycleData.weeks.push(weekData);
            });
            state.cycles.push(cycleData);
        });
        return state;
    }

    function renderState(state) {
        document.getElementById('pmTbody').innerHTML = '';
        document.getElementById('cyclesContainer').innerHTML = '';
        showTimelinePlaceholder();
        if (state.pm) state.pm.forEach(pm => addPmRow(pm.name, pm.val));
        if (state.periods) state.periods.forEach(p => addPeriodColumn(p.name, p.sub, p.desc));
        if (state.cycles) {
            state.cycles.forEach(cycle => {
                const cycleId = addNewCycle();
                const cycleBlock = document.getElementById(`cycle-${cycleId}`);
                cycleBlock.querySelector('.cycle-title-input').value = cycle.title;
                const weeksContainer = document.getElementById(`weeks-container-${cycleId}`);
                weeksContainer.innerHTML = ''; 
                cycle.weeks.forEach(week => {
                    const weekId = addNewWeek(cycleId);
                    const weekBlock = document.getElementById(`week-${weekId}`);
                    weekBlock.querySelector('.week-name-input').value = week.title;
                    const workoutsContainer = document.getElementById(`workouts-container-${weekId}`);
                    workoutsContainer.innerHTML = '';
                    week.workouts.forEach(workout => {
                        const workoutId = addWorkoutToWeek(weekId);
                        const workoutBlock = document.getElementById(`workout-${workoutId}`);

    function updateAllCalculations() {
        const pmData = getPmData();
        document.querySelectorAll('.week-block').forEach(weekBlock => {
            let weekKpsh = 0, weekOt = 0;
            weekBlock.querySelectorAll('.workout-block').forEach(workoutBlock => {
                const workoutId = workoutBlock.id.split('-')[1];
                let woKpsh = 0, woOt = 0;
                
                workoutBlock.querySelectorAll('tbody tr').forEach(tr => {
                    const pm = pmData[tr.querySelector('.ex-name').value] || 0;
                    let exKpsh = 0, exOt = 0;
                    
                    tr.querySelectorAll('.set-block').forEach(setBlock => {
                        const w = parseFloat(setBlock.querySelector('.set-weight').value) || 0;
                        const s = parseFloat(setBlock.querySelector('.set-sets').value) || 0;
                        const r = parseFloat(setBlock.querySelector('.set-reps').value) || 0;
                        const pDisp = setBlock.querySelector('.set-percent');
                        
                        setBlock.className = 'set-block set-inactive'; pDisp.className = 'set-percent';
                        
                        if (pm > 0 && w > 0 && s > 0 && r > 0) {
                            const percent = (w / pm) * 100;
                            pDisp.textContent = Math.round(percent) + '%';
                            
                            if (percent >= 90) setBlock.classList.add('set-black');
                            else if (percent >= 80) setBlock.classList.add('set-red');
                            else if (percent >= 70) setBlock.classList.add('set-orange');
                            else if (percent >= 60) setBlock.classList.add('set-yellow');
                            else if (percent >= 50) setBlock.classList.add('set-green');
                            
                            if (percent >= 50) {
                                setBlock.classList.remove('set-inactive');
                                exKpsh += s * r; exOt += (s * r * percent);
                            }
                        } else pDisp.textContent = '0%';
                    });
                    
                    tr.querySelector('.calc-kpsh').textContent = Math.round(exKpsh) || 0;
                    tr.querySelector('.calc-ot').textContent = Math.round(exOt) || 0;
                    tr.querySelector('.calc-oi').textContent = exKpsh > 0 ? parseFloat((exOt / exKpsh).toFixed(1)) : 0;
                    
                    woKpsh += exKpsh; woOt += exOt;
                });
                
                workoutBlock.querySelector('.w-t-kpsh').textContent = Math.round(woKpsh) || 0;
                workoutBlock.querySelector('.w-t-ot').textContent = Math.round(woOt) || 0;
                workoutBlock.querySelector('.w-t-oi').textContent = woKpsh > 0 ? parseFloat((woOt / woKpsh).toFixed(1)) : 0;
                
                weekKpsh += woKpsh; weekOt += woOt;
            });
            
            weekBlock.querySelector('.w-kpsh').textContent = Math.round(weekKpsh) || 0;
            weekBlock.querySelector('.w-ot').textContent = Math.round(weekOt) || 0;
            weekBlock.querySelector('.w-oi').textContent = weekKpsh > 0 ? parseFloat((weekOt / weekKpsh).toFixed(1)) : 0;
        });
        renderCharts();
        renderZoneCharts(); 
        updateChartDropdown();
    }

    const verticalLinePlugin = {
        id: 'verticalLine',
        beforeDraw: (chart) => {
            if (chart.config.options.plugins.verticalLine && chart.config.options.plugins.verticalLine.lines) {
                const lines = chart.config.options.plugins.verticalLine.lines;
                const ctx = chart.ctx;
                const xAxis = chart.scales.x;
                const yAxis = chart.scales.y;
                ctx.save(); 
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim(); 
                ctx.setLineDash([5, 5]); 
                ctx.lineWidth = 1;
                lines.forEach(index => {
                    let x;
                    if (index === 0) { x = xAxis.left; } 
                    else {
                        const prevX = xAxis.getPixelForValue(index - 1);
                        const currX = xAxis.getPixelForValue(index);
                        x = (prevX + currX) / 2;
                    }
                    ctx.beginPath(); ctx.moveTo(x, yAxis.top); ctx.lineTo(x, yAxis.bottom); ctx.stroke();
                });
                ctx.restore();
            }
        }
    };
    Chart.register(verticalLinePlugin);

    function getChartData() {
        const selectedEx = document.getElementById('ex-chart-select').value;
        const labelsWo = [], labelsWeek = [];
        const weekLinesIndices = [], cycleLinesIndices = [];
        const data = { wo: { kpsh: [], oi: [], ot: [] }, week: { kpsh: [], oi: [], ot: [] }, ex: { kpsh: [], oi: [], ot: [] } };

        let globalWorkoutIndex = 0;
        document.querySelectorAll('.cycle-block').forEach((cycle, cIdx) => {
            if (cIdx > 0) cycleLinesIndices.push(labelsWeek.length); 
            cycle.querySelectorAll('.week-block').forEach((week, wIdx) => {
                labelsWeek.push(week.querySelector('.week-name-input').value || `Н${wIdx+1}`);
                if (wIdx > 0) weekLinesIndices.push(globalWorkoutIndex); 

                let weekKpsh = 0, weekOt = 0;
                week.querySelectorAll('.workout-block').forEach(workout => {
                    labelsWo.push(workout.querySelector('.workout-title-input').value || `Т${globalWorkoutIndex+1}`);
                    let woKpsh = 0, woOt = 0, exKpsh = 0, exOt = 0;

                    workout.querySelectorAll('.workout-tbody tr').forEach(tr => {
                        const exName = tr.querySelector('.ex-name').value;
                        const kpsh = parseFloat(tr.querySelector('.calc-kpsh').textContent) || 0;
                        const ot = parseFloat(tr.querySelector('.calc-ot').textContent) || 0;
                        woKpsh += kpsh; woOt += ot;
                        if (exName === selectedEx) { exKpsh += kpsh; exOt += ot; }
                    });

                    data.wo.kpsh.push(woKpsh); data.wo.ot.push(woOt); data.wo.oi.push(woKpsh > 0 ? parseFloat((woOt / woKpsh).toFixed(1)) : 0);
                    data.ex.kpsh.push(exKpsh === 0 ? null : exKpsh); data.ex.ot.push(exOt === 0 ? null : exOt); data.ex.oi.push(exKpsh > 0 ? parseFloat((exOt / exKpsh).toFixed(1)) : null);
                    weekKpsh += woKpsh; weekOt += woOt;
                    globalWorkoutIndex++;
                });
                data.week.kpsh.push(weekKpsh); data.week.ot.push(weekOt); data.week.oi.push(weekKpsh > 0 ? parseFloat((weekOt / weekKpsh).toFixed(1)) : 0);
            });
        });
        return { labelsWo, labelsWeek, data, weekLinesIndices, cycleLinesIndices };
    }

    function renderZoneCharts() {
        const selectedEx = document.getElementById('zone-chart-select').value;
        const pmData = getPmData();
        const zones = ['50-59%', '60-69%', '70-79%', '80-89%', '90%+'];
        const zoneColors = ['#2ecc71', '#f1c40f', '#e67e22', '#e74c3c', '#2c3e50'];
        
        let exZoneData = [0, 0, 0, 0, 0];
        let allZoneData = [0, 0, 0, 0, 0];

        document.querySelectorAll('.workout-tbody tr').forEach(tr => {
            const exName = tr.querySelector('.ex-name').value;
            const pm = pmData[exName] || 0;
            if (pm === 0) return; 

            tr.querySelectorAll('.set-block').forEach(setBlock => {
                const weight = parseFloat(setBlock.querySelector('.set-weight').value) || 0;
                const sets = parseFloat(setBlock.querySelector('.set-sets').value) || 0;
                const reps = parseFloat(setBlock.querySelector('.set-reps').value) || 0;

                if (weight > 0 && sets > 0 && reps > 0) {
                    const percent = (weight / pm) * 100;
                    const kpsh = sets * reps;
                    let zoneIndex = -1;
                    if (percent >= 90) zoneIndex = 4;
                    else if (percent >= 80) zoneIndex = 3;
                    else if (percent >= 70) zoneIndex = 2;
                    else if (percent >= 60) zoneIndex = 1;
                    else if (percent >= 50) zoneIndex = 0;

                    if (zoneIndex !== -1) {
                        allZoneData[zoneIndex] += kpsh;
                        if (exName === selectedEx) exZoneData[zoneIndex] += kpsh;
                    }
                }
            });
        });

        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-main').trim();

        const getDoughnutOptions = () => ({
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position: 'right', labels: { color: textColor, boxWidth: 12, font: { size: 10 } } },
                datalabels: {
                    color: '#fff', font: { weight: 'bold', size: 11 },
                    formatter: (value, ctx) => {
                        let sum = 0;
                        ctx.chart.data.datasets[0].data.map(data => { sum += data; });
                        return sum === 0 ? '' : (value * 100 / sum).toFixed(1) + "%";
                    },
                    display: (ctx) => {
                        const val = ctx.dataset.data[ctx.dataIndex];
                        let sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                        return val > 0 && (val / sum) > 0.05; 
                    }
                }
            }
        });

        if (chartZoneEx) chartZoneEx.destroy();
        chartZoneEx = new Chart(document.getElementById('chart-zone-ex').getContext('2d'), {
            type: 'doughnut', data: { labels: zones, datasets: [{ data: exZoneData, backgroundColor: zoneColors, borderWidth: 1 }] }, options: getDoughnutOptions()
        });

        if (chartZoneAll) chartZoneAll.destroy();
        chartZoneAll = new Chart(document.getElementById('chart-zone-all').getContext('2d'), {
            type: 'doughnut', data: { labels: zones, datasets: [{ data: allZoneData, backgroundColor: zoneColors, borderWidth: 1 }] }, options: getDoughnutOptions()
        });
    }

    function exportToWord() { /* ... код из предыдущего шага ... */ }
    function exportToJSON() { /* ... */ }
    function importFromJSON(event) { /* ... */ }

    window.onload = () => { loadDictionaryData(); };
    document.getElementById('ex-chart-select').addEventListener('change', renderCharts);
</script>
