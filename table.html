<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор программ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для таймлайна */
        .timeline-section { background: white; padding: 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,0.05); margin-bottom: 10px; overflow-x: auto; }
        .timeline-table { border-collapse: collapse; width: 100%; min-width: 500px; table-layout: fixed;}
        .timeline-table td, .timeline-table th { border: 1px solid #ccc; padding: 4px; text-align: center; vertical-align: top; }
        
        .timeline-name-input { font-weight: bold; text-align: center; border: 1px solid transparent; background: transparent; width: 100%; outline: none; font-family: inherit; font-size: 12px; color: #333;}
        .timeline-name-input:focus { border-color: #3498db; background: white; }
        
        .timeline-sub-input { text-align: center; border: 1px solid transparent; background: transparent; width: 100%; outline: none; font-family: inherit; font-size: 11px; color: #555;}
        .timeline-sub-input:focus { border-color: #3498db; background: white; }
        
        .timeline-desc-input { text-align: left; border: 1px solid transparent; background: transparent; width: 100%; outline: none; font-family: inherit; font-size: 11px; color: #666; resize: vertical; min-height: 40px;}
        .timeline-desc-input:focus { border-color: #3498db; background: white; }
        
        .timeline-del-btn { background: transparent; color: #e74c3c; border: none; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0; float: right; line-height:1; }
        .timeline-del-btn:hover { color: #c0392b; }
        
        /* Пастельные цвета для колонок */
        .bg-color-0 { background-color: #e8f4f8; }
        .bg-color-1 { background-color: #f9f0e8; }
        .bg-color-2 { background-color: #f0f9e8; }
        .bg-color-3 { background-color: #f4e8f9; }
        .bg-color-4 { background-color: #f9e8e8; }
    </style>
</head>
<body>

<!-- Верхняя навигация -->
<div class="top-nav">
    <a href="index.html" class="btn-link" style="padding: 5px 10px; border-radius: 4px;">← Назад в библиотеку</a>
    <span style="font-weight: bold; color: #2c3e50;">Конструктор программы</span>
    <div style="width: 120px;"></div> 
</div>

<div class="layout">
    <!-- ЛЕВАЯ ПАНЕЛЬ (КОНСТРУКТОР) -->
    <div class="left-panel">
        
        <!-- Секция ПМ -->
        <div class="pm-section">
            <div>
                <div style="font-weight:bold; margin-bottom:4px; font-size:11px;">ПМ (кг)</div>
                <table class="pm-table" id="pmTable">
                    <thead>
                        <tr><th>УПР</th><th>ПМ</th><th></th></tr>
                    </thead>
                    <tbody id="pmTbody"></tbody>
                </table>
                <button class="btn-add" style="margin-top: 4px;" onclick="addPmRow()">+ Добавить ПМ</button>
            </div>
        </div>

        <!-- ТАЙМЛАЙН ПЕРИОДОВ -->
        <div class="timeline-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div style="font-weight:bold; font-size:11px;">Структура макроцикла (Периоды)</div>
                <button class="btn-add" style="padding: 2px 8px; font-size: 11px;" onclick="addPeriodColumn()">+ Добавить период</button>
            </div>
            
            <table class="timeline-table" id="timelineTable">
                <tbody>
                    <tr id="timelineNamesRow"></tr>
                    <tr id="timelineSubRow"></tr>
                    <tr id="timelineDescRow"></tr>
                </tbody>
            </table>
        </div>

        <!-- Контейнер для циклов -->
        <div id="cyclesContainer"></div>

        <!-- Кнопка создания цикла -->
        <button class="btn-cycle" onclick="addNewCycle()">+ Создать новый цикл (макро/мезо)</button>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ (ГРАФИКИ) -->
    <div class="right-panel">
        <div>📈</div>
        <div>Здесь будет блок графиков</div>
    </div>

</div>

<script>
    let globalCycleCounter = 0;
    let globalWeekCounter = 0;
    let globalWorkoutCounter = 0;
    let globalExCounter = 0;
    let globalPeriodCounter = 0;

    // ==========================================
    // СИСТЕМА АВТОСОХРАНЕНИЯ
    // ==========================================
    
    function saveState() {
        const state = { cycles: [], periods: [] };

        const pmData = [];
        document.querySelectorAll('#pmTbody tr').forEach(tr => {
            pmData.push({ name: tr.querySelector('.pm-name').value, val: tr.querySelector('.pm-val').value });
        });
        state.pm = pmData;

        const timelineNames = document.getElementById('timelineNamesRow');
        if (timelineNames.children.length > 0 && !timelineNames.children[0].classList.contains('empty-placeholder')) {
            for (let i = 0; i < timelineNames.children.length; i++) {
                state.periods.push({
                    name: timelineNames.children[i].querySelector('input').value,
                    sub: document.getElementById('timelineSubRow').children[i].querySelector('input').value,
                    desc: document.getElementById('timelineDescRow').children[i].querySelector('textarea').value
                });
            }
        }

        document.querySelectorAll('.cycle-block').forEach(cycle => {
            const cycleData = { title: cycle.querySelector('.cycle-title-input').value, weeks: [] };
            cycle.querySelectorAll('.week-block').forEach(week => {
                const weekData = { title: week.querySelector('.week-name-input').value, workouts: [] };
                week.querySelectorAll('.workout-block').forEach(workout => {
                    const workoutData = { title: workout.querySelector('.workout-title-input').value, exercises: [] };
                    workout.querySelectorAll('.workout-tbody tr').forEach(tr => {
                        const exData = {
                            name: tr.querySelector('.ex-name').value,
                            pm: tr.querySelector('.ex-pm').value,
                            comment: tr.querySelector('.ex-comment') ? tr.querySelector('.ex-comment').value : '',
                            sets: []
                        };
                        tr.querySelectorAll('.set-block').forEach(set => {
                            exData.sets.push({
                                weight: set.querySelector('.set-weight').value,
                                sets: set.querySelector('.set-sets').value,
                                reps: set.querySelector('.set-reps').value
                            });
                        });
                        workoutData.exercises.push(exData);
                    });
                    weekData.workouts.push(workoutData);
                });
                cycleData.weeks.push(weekData);
            });
            state.cycles.push(cycleData);
        });

        localStorage.setItem('trainerAppState', JSON.stringify(state));
    }

    function loadState() {
        const saved = localStorage.getItem('trainerAppState');
        if (!saved) return false;

        const state = JSON.parse(saved);

        if (state.pm) state.pm.forEach(pm => addPmRow(pm.name, pm.val));
        if (state.periods) state.periods.forEach(p => addPeriodColumn(p.name, p.sub, p.desc));

        if (state.cycles) {
            state.cycles.forEach(cycle => {
                const cycleId = addNewCycle();
                const cycleBlock = document.getElementById(`cycle-${cycleId}`);
                cycleBlock.querySelector('.cycle-title-input').value = cycle.title;
                
                const weeksContainer = document.getElementById(`weeks-container-${cycleId}`);
                weeksContainer.innerHTML = ''; 

                cycle.weeks.forEach(week => {
                    const weekId = addNewWeek(cycleId);
                    const weekBlock = document.getElementById(`week-${weekId}`);
                    weekBlock.querySelector('.week-name-input').value = week.title;
                    
                    const workoutsContainer = document.getElementById(`workouts-container-${weekId}`);
                    workoutsContainer.innerHTML = '';

                    week.workouts.forEach(workout => {
                        const workoutId = addWorkoutToWeek(weekId);
                        const workoutBlock = document.getElementById(`workout-${workoutId}`);
                        workoutBlock.querySelector('.workout-title-input').value = workout.title;
                        
                        const tbody = workoutBlock.querySelector('.workout-tbody');
                        tbody.innerHTML = '';

                        workout.exercises.forEach(ex => {
                            const exId = addExerciseRow(workoutId);
                            const tr = document.getElementById(`ex-${workoutId}-${exId}`);
                            
                            tr.querySelector('.ex-name').value = ex.name;
                            tr.querySelector('.ex-pm').value = ex.pm;
                            if (tr.querySelector('.ex-comment')) tr.querySelector('.ex-comment').value = ex.comment;
                            
                            const setsContainer = tr.querySelector('.scroll-sets');
                            setsContainer.innerHTML = ''; 
                            
                            ex.sets.forEach(set => {
                                addSet(workoutId, exId, set.weight, set.sets, set.reps);
                            });
                        });
                    });
                });
            });
        }
        updateAllCalculations();
        return true;
    }

    document.addEventListener('input', saveState);
    document.addEventListener('click', () => setTimeout(saveState, 50)); 

    // ==========================================
    // БАЗОВЫЕ ФУНКЦИИ
    // ==========================================

    function addPmRow(name = '', val = '') {
        const tbody = document.querySelector('#pmTbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="pm-name" value="${name}" placeholder="Название"></td>
            <td><input type="number" class="pm-val" value="${val}" placeholder="0"></td>
            <td><button class="btn-del" onclick="delPmRow(this)">x</button></td>
        `;
        tbody.appendChild(tr);
        updateAllCalculations(); 
    }

    function delPmRow(btn) {
        btn.closest('tr').remove();
        updateAllCalculations();
    }

    function getPmData() {
        const pmData = {};
        document.querySelectorAll('#pmTbody tr').forEach(tr => {
            const name = tr.querySelector('.pm-name').value.trim();
            const val = parseFloat(tr.querySelector('.pm-val').value) || 0;
            if (name) pmData[name] = val;
        });
        return pmData;
    }

    function addPeriodColumn(name = 'Период', sub = '', desc = '') {
        const id = globalPeriodCounter++;
        const bgClass = `bg-color-${id % 5}`;

        removeTimelinePlaceholder();

        const nameTd = document.createElement('td');
        nameTd.className = bgClass;
        nameTd.style.position = 'relative';
        nameTd.innerHTML = `
            <button class="timeline-del-btn" onclick="deletePeriod(this)" title="Удалить период">×</button>
            <input type="text" class="timeline-name-input" value="${name}" placeholder="Название">
        `;
        document.getElementById('timelineNamesRow').appendChild(nameTd);

        const subTd = document.createElement('td');
        subTd.className = bgClass;
        subTd.innerHTML = `<input type="text" class="timeline-sub-input" value="${sub}" placeholder="Напр: 5 недель">`;
        document.getElementById('timelineSubRow').appendChild(subTd);

        const descTd = document.createElement('td');
        descTd.className = bgClass;
        descTd.innerHTML = `<textarea class="timeline-desc-input" placeholder="Описание...">${desc}</textarea>`;
        document.getElementById('timelineDescRow').appendChild(descTd);
    }

    function deletePeriod(btn) {
        const td = btn.closest('td');
        const index = Array.from(td.parentNode.children).indexOf(td);
        
        document.getElementById('timelineNamesRow').children[index].remove();
        document.getElementById('timelineSubRow').children[index].remove();
        document.getElementById('timelineDescRow').children[index].remove();

        if (document.getElementById('timelineNamesRow').children.length === 0) {
            showTimelinePlaceholder();
        }
    }

    function removeTimelinePlaceholder() {
        const namesRow = document.getElementById('timelineNamesRow');
        if (namesRow.children.length === 1 && namesRow.children[0].classList.contains('empty-placeholder')) {
            namesRow.innerHTML = '';
            document.getElementById('timelineSubRow').innerHTML = '';
            document.getElementById('timelineDescRow').innerHTML = '';
        }
    }

    function showTimelinePlaceholder() {
        document.getElementById('timelineNamesRow').innerHTML = '<td class="empty-placeholder" colspan="1" style="color:#aaa; font-style:italic; text-align:center;">Нет добавленных периодов</td>';
        document.getElementById('timelineSubRow').innerHTML = '<td style="border:none;"></td>';
        document.getElementById('timelineDescRow').innerHTML = '<td style="border:none;"></td>';
    }

    // --- УПРАВЛЕНИЕ ЦИКЛАМИ ---
    function addNewCycle(isCopy = false) {
        const cycleId = globalCycleCounter++;
        const container = document.getElementById('cyclesContainer');
        
        // Считаем текущее количество циклов на экране
        const currentCyclesCount = container.children.length;
        
        // Формируем название
        let defaultName = '';
        if (isCopy) {
            defaultName = `Цикл ${currentCyclesCount} (копия)`;
        } else {
            defaultName = `Цикл ${currentCyclesCount + 1}`;
        }
        
        const cycleBlock = document.createElement('div');
        cycleBlock.className = 'cycle-block';
        cycleBlock.id = `cycle-${cycleId}`;
        
        cycleBlock.innerHTML = `
            <div class="cycle-header">
                <div class="cycle-title-wrapper">
                    <span class="collapse-icon" id="icon-cycle-${cycleId}" onclick="toggleCycle(${cycleId})" style="cursor:pointer;">▼</span>
                    <input type="text" class="cycle-title-input" value="${defaultName}" placeholder="Название цикла...">
                    <button class="btn-copy" onclick="copyCycle(${cycleId})">📄 Копировать</button>
                    <button class="btn-delete-item" onclick="deleteCycle(${cycleId})">🗑 Удалить</button>
                </div>
            </div>
            <div class="cycle-content" id="cycle-content-${cycleId}">
                <div id="weeks-container-${cycleId}"></div>
                <button class="btn-add" style="margin-top: 5px;" onclick="addNewWeek(${cycleId})">+ Добавить неделю в этот цикл</button>
            </div>
        `;
        
        container.appendChild(cycleBlock);
        
        if (!isCopy) {
            addNewWeek(cycleId);
        }
        return cycleId;
    }

    function toggleCycle(cycleId) {
        const content = document.getElementById(`cycle-content-${cycleId}`);
        const icon = document.getElementById(`icon-cycle-${cycleId}`);
        if (content.classList.contains('hidden')) {
            content.classList.remove('hidden');
            icon.textContent = '▼';
        } else {
            content.classList.add('hidden');
            icon.textContent = '►';
        }
    }

    function deleteCycle(cycleId) {
        if(confirm('Вы уверены, что хотите удалить этот цикл?')) {
            const cycleBlock = document.getElementById(`cycle-${cycleId}`);
            if (cycleBlock) {
                cycleBlock.remove();
                updateAllCalculations();
            }
        }
    }

    function copyCycle(sourceCycleId) {
        const newCycleId = globalCycleCounter;
        addNewCycle(true); // Передаем true, чтобы название сформировалось как "(копия)"
        
        const sourceCycleBlock = document.getElementById(`cycle-${sourceCycleId}`);
        const newCycleBlock = document.getElementById(`cycle-${newCycleId}`);
        const newWeeksContainer = document.getElementById(`weeks-container-${newCycleId}`);
        
        // Копируем оригинальное название и добавляем "(копия)"
        newCycleBlock.querySelector('.cycle-title-input').value = sourceCycleBlock.querySelector('.cycle-title-input').value + ' (копия)';
        newWeeksContainer.innerHTML = '';
        
        sourceCycleBlock.querySelectorAll('.week-block').forEach(sourceWeek => {
            const weekId = globalWeekCounter++;
            const newWeekBlock = document.createElement('div');
            newWeekBlock.className = 'week-block';
            newWeekBlock.id = `week-${weekId}`;
            newWeekBlock.dataset.parentId = ''; 
            
            newWeekBlock.innerHTML = `
                <div class="week-header">
                    <div class="week-title-wrapper">
                        <span class="collapse-icon" id="icon-week-${weekId}" onclick="toggleWeek(${weekId})" style="cursor:pointer;">▼</span> 
                        <input type="text" class="week-name-input" id="name-week-${weekId}" value="${sourceWeek.querySelector('.week-name-input').value}" placeholder="Название недели...">
                        <button class="btn-copy" onclick="copyWeek(${weekId})">📄 Копировать</button>
                        <button class="btn-delete-item" onclick="deleteWeek(${weekId})">🗑 Удалить</button>
                    </div>
                    <div class="week-summary" id="week-summary-${weekId}">
                        <div>КПШ: <span class="w-kpsh main-val">0</span><span class="trend-container" id="trend-kpsh-${weekId}"></span></div>
                        <div>ОИ: <span class="w-oi main-val">0</span><span class="trend-container" id="trend-oi-${weekId}"></span></div>
                        <div>ОТ: <span class="w-ot main-val">0</span><span class="trend-container" id="trend-ot-${weekId}"></span></div>
                    </div>
                </div>
                <div class="week-content" id="week-content-${weekId}">
                    <div id="workouts-container-${weekId}"></div>
                    <button class="btn-add" onclick="addWorkoutToWeek(${weekId})">+ Добавить тренировку</button>
                </div>
            `;
            newWeeksContainer.appendChild(newWeekBlock);
            
            const newWeeksContent = newWeekBlock.querySelector(`#workouts-container-${weekId}`);
            
            sourceWeek.querySelectorAll('.workout-block').forEach((sourceWorkout) => {
                const workoutId = globalWorkoutCounter++;
                const newWorkoutDiv = document.createElement('div');
                newWorkoutDiv.className = 'workout-block';
                newWorkoutDiv.id = `workout-${workoutId}`;
                newWorkoutDiv.dataset.parentWorkoutId = ''; 
                
                newWorkoutDiv.innerHTML = `
                    <div class="workout-header">
                        <input type="text" class="workout-title-input" value="${sourceWorkout.querySelector('.workout-title-input').value}">
                        <button class="btn-del" style="background:#95a5a6;" onclick="this.closest('.workout-block').remove(); updateAllCalculations();">Удалить тренировку</button>
                    </div>
                    <table class="main-table" id="table-${workoutId}">
                        <thead>
                            <tr>
                                <th width="70">УПР</th>
                                <th width="50">ПМ</th>
                                <th>Подходы (Вес / Подх х Повт)</th>
                                <th width="50">КПШ</th>
                                <th width="50">ОИ</th>
                                <th width="50">ОТ</th>
                                <th width="100">Комментарий</th>
                                <th width="20"></th>
                            </tr>
                        </thead>
                        <tbody class="workout-tbody"></tbody>
                        <tfoot>
                            <tr style="font-weight: bold; background-color: #f9f9f9;">
                                <td colspan="3" style="text-align: right; padding-right: 8px; font-size: 10px;">Сумма:</td>
                                <td class="w-t-kpsh calc-cell">0<span class="trend-container" id="trend-w-kpsh-${workoutId}"></span></td>
                                <td class="w-t-oi calc-cell">0<span class="trend-container" id="trend-w-oi-${workoutId}"></span></td>
                                <td class="w-t-ot calc-cell">0<span class="trend-container" id="trend-w-ot-${workoutId}"></span></td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                    <div style="margin-top: 4px;">
                        <button class="btn-add-set" onclick="addExerciseRow(${workoutId})">+ Упражнение</button>
                    </div>
                `;
                
                newWeeksContent.appendChild(newWorkoutDiv);
                const newTbody = newWorkoutDiv.querySelector('.workout-tbody');
                
                sourceWorkout.querySelectorAll('.workout-tbody tr').forEach((sourceTr) => {
                    const exId = globalExCounter++;
                    const pm = sourceTr.querySelector('.ex-pm').value;
                    const name = sourceTr.querySelector('.ex-name').value;
                    const comment = sourceTr.querySelector('.ex-comment') ? sourceTr.querySelector('.ex-comment').value : '';
                    
                    const newTr = document.createElement('tr');
                    newTr.id = `ex-${workoutId}-${exId}`;
                    newTr.dataset.parentExId = '';
                    
                    newTr.innerHTML = `
                        <td><input type="text" class="input-ex ex-name" value="${name}" placeholder="Название" oninput="onExNameChange(${workoutId}, ${exId})"></td>
                        <td><input type="number" class="input-ex ex-pm" value="${pm}" placeholder="ПМ" oninput="updateAllCalculations()"></td>
                        <td>
                            <div class="scroll-sets" id="sets-container-${workoutId}-${exId}"></div>
                            <button class="btn-add-set" style="margin-top:2px;" onclick="addSet(${workoutId}, ${exId})">+ Подход</button>
                        </td>
                        <td class="calc-kpsh calc-cell">0<span class="trend-container" id="trend-ex-kpsh-${workoutId}-${exId}"></span></td>
                        <td class="calc-oi calc-cell">0<span class="trend-container" id="trend-ex-oi-${workoutId}-${exId}"></span></td>
                        <td class="calc-ot calc-cell">0<span class="trend-container" id="trend-ex-ot-${workoutId}-${exId}"></span></td>
                        <td><input type="text" class="input-ex comment ex-comment" value="${comment}" placeholder="Комментарий..."></td>
                        <td><button class="btn-del" onclick="this.closest('tr').remove(); updateAllCalculations();">x</button></td>
                    `;
                    newTbody.appendChild(newTr);
                    
                    const newSetsContainer = newTr.querySelector('.scroll-sets');
                    sourceTr.querySelectorAll('.set-block').forEach(sourceSet => {
                        const weight = sourceSet.querySelector('.set-weight').value;
                        const sets = sourceSet.querySelector('.set-sets').value;
                        const reps = sourceSet.querySelector('.set-reps').value;
                        
                        const setDiv = document.createElement('div');
                        setDiv.className = 'set-block set-inactive';
                        setDiv.innerHTML = `
                            <div class="set-col" style="width:100%;">
                                <div class="set-label">Вес</div>
                                <input type="number" class="input-set set-weight" value="${weight}" oninput="updateAllCalculations()">
                            </div>
                            <div class="set-row">
                                <div class="set-col">
                                    <div class="set-label">Подх</div>
                                    <input type="number" class="input-set set-sets" value="${sets}" oninput="updateAllCalculations()">
                                </div>
                                <div class="set-col">
                                    <div class="set-label">Повт</div>
                                    <input type="number" class="input-set set-reps" value="${reps}" oninput="updateAllCalculations()">
                                </div>
                            </div>
                            <div class="set-percent">0%</div>
                            <button class="btn-del" style="margin-top:2px; padding:0px 4px;" onclick="this.parentElement.remove(); updateAllCalculations();">x</button>
                        `;
                        newSetsContainer.appendChild(setDiv);
                    });
                });
            });
        });
        
        updateAllCalculations();
    }

    function addNewWeek(cycleId, sourceWeekId = null) {
        const weekId = globalWeekCounter++;
        const container = document.getElementById(`weeks-container-${cycleId}`);
        
        const weekBlock = document.createElement('div');
        weekBlock.className = 'week-block';
        weekBlock.id = `week-${weekId}`;
        weekBlock.dataset.parentId = sourceWeekId !== null ? sourceWeekId : '';
        
        let defaultName = `Неделя ${container.children.length + 1}`;
        
        weekBlock.innerHTML = `
            <div class="week-header">
                <div class="week-title-wrapper">
                    <span class="collapse-icon" id="icon-week-${weekId}" onclick="toggleWeek(${weekId})" style="cursor:pointer;">▼</span> 
                    <input type="text" class="week-name-input" id="name-week-${weekId}" value="${defaultName}" placeholder="Название микроцикла...">
                    <button class="btn-copy" onclick="copyWeek(${weekId})">📄 Копировать</button>
                    <button class="btn-delete-item" onclick="deleteWeek(${weekId})">🗑 Удалить</button>
                </div>
                <div class="week-summary" id="week-summary-${weekId}">
                    <div>КПШ: <span class="w-kpsh main-val">0</span><span class="trend-container" id="trend-kpsh-${weekId}"></span></div>
                    <div>ОИ: <span class="w-oi main-val">0</span><span class="trend-container" id="trend-oi-${weekId}"></span></div>
                    <div>ОТ: <span class="w-ot main-val">0</span><span class="trend-container" id="trend-ot-${weekId}"></span></div>
                </div>
            </div>
            <div class="week-content" id="week-content-${weekId}">
                <div id="workouts-container-${weekId}"></div>
                <button class="btn-add" onclick="addWorkoutToWeek(${weekId})">+ Добавить тренировку</button>
            </div>
        `;
        
        container.appendChild(weekBlock);
        
        if (sourceWeekId === null) {
            addWorkoutToWeek(weekId);
        } else {
            const originalName = document.getElementById(`name-week-${sourceWeekId}`).value;
            document.getElementById(`name-week-${weekId}`).value = originalName + ' (копия)';
        }
        
        weekBlock.scrollIntoView({ behavior: 'smooth' });
        updateAllCalculations();
        return weekId;
    }

    function deleteWeek(weekId) {
        if(confirm('Вы уверены, что хотите удалить эту неделю?')) {
            const weekBlock = document.getElementById(`week-${weekId}`);
            if (weekBlock) {
                weekBlock.remove();
                updateAllCalculations();
            }
        }
    }

    function toggleWeek(weekId) {
        const content = document.getElementById(`week-content-${weekId}`);
        const icon = document.getElementById(`icon-week-${weekId}`);
        if (content.classList.contains('hidden')) {
            content.classList.remove('hidden');
            icon.textContent = '▼';
        } else {
            content.classList.add('hidden');
            icon.textContent = '►';
        }
    }

    function copyWeek(sourceWeekId) {
        const sourceWeekBlock = document.getElementById(`week-${sourceWeekId}`);
        const cycleId = sourceWeekBlock.closest('.cycle-block').id.split('-')[1];
        
        const newWeekId = globalWeekCounter;
        addNewWeek(cycleId, sourceWeekId);
        
        const newWeekContent = document.getElementById(`week-content-${newWeekId}`);
        newWeekContent.querySelector('#workouts-container-' + newWeekId).innerHTML = '';
        
        sourceWeekBlock.querySelectorAll('.workout-block').forEach((sourceWorkout) => {
            const workoutId = globalWorkoutCounter++;
            const newWorkoutDiv = document.createElement('div');
            newWorkoutDiv.className = 'workout-block';
            newWorkoutDiv.id = `workout-${workoutId}`;
            newWorkoutDiv.dataset.parentWorkoutId = sourceWorkout.id.split('-')[1];
            
            newWorkoutDiv.innerHTML = `
                <div class="workout-header">
                    <input type="text" class="workout-title-input" value="${sourceWorkout.querySelector('.workout-title-input').value}">
                    <button class="btn-del" style="background:#95a5a6;" onclick="this.closest('.workout-block').remove(); updateAllCalculations();">Удалить тренировку</button>
                </div>
                <table class="main-table" id="table-${workoutId}">
                    <thead>
                        <tr>
                            <th width="70">УПР</th>
                            <th width="50">ПМ</th>
                            <th>Подходы (Вес / Подх х Повт)</th>
                            <th width="50">КПШ</th>
                            <th width="50">ОИ</th>
                            <th width="50">ОТ</th>
                            <th width="100">Комментарий</th>
                            <th width="20"></th>
                        </tr>
                    </thead>
                    <tbody class="workout-tbody"></tbody>
                    <tfoot>
                        <tr style="font-weight: bold; background-color: #f9f9f9;">
                            <td colspan="3" style="text-align: right; padding-right: 8px; font-size: 10px;">Сумма:</td>
                            <td class="w-t-kpsh calc-cell">0<span class="trend-container" id="trend-w-kpsh-${workoutId}"></span></td>
                            <td class="w-t-oi calc-cell">0<span class="trend-container" id="trend-w-oi-${workoutId}"></span></td>
                            <td class="w-t-ot calc-cell">0<span class="trend-container" id="trend-w-ot-${workoutId}"></span></td>
                            <td colspan="2"></td>
                        </tr>
                    </tfoot>
                </table>
                <div style="margin-top: 4px;">
                    <button class="btn-add-set" onclick="addExerciseRow(${workoutId})">+ Упражнение</button>
                </div>
            `;
            
            newWeekContent.querySelector('#workouts-container-' + newWeekId).appendChild(newWorkoutDiv);
            const newTbody = newWorkoutDiv.querySelector('.workout-tbody');
            
            sourceWorkout.querySelectorAll('.workout-tbody tr').forEach((sourceTr) => {
                const exId = globalExCounter++;
                const pm = sourceTr.querySelector('.ex-pm').value;
                const name = sourceTr.querySelector('.ex-name').value;
                const comment = sourceTr.querySelector('.ex-comment') ? sourceTr.querySelector('.ex-comment').value : '';
                
                const newTr = document.createElement('tr');
                newTr.id = `ex-${workoutId}-${exId}`;
                newTr.dataset.parentExId = sourceTr.id.split('-')[2]; 
                
                newTr.innerHTML = `
                    <td><input type="text" class="input-ex ex-name" value="${name}" placeholder="Название" oninput="onExNameChange(${workoutId}, ${exId})"></td>
                    <td><input type="number" class="input-ex ex-pm" value="${pm}" placeholder="ПМ" oninput="updateAllCalculations()"></td>
                    <td>
                        <div class="scroll-sets" id="sets-container-${workoutId}-${exId}"></div>
                        <button class="btn-add-set" style="margin-top:2px;" onclick="addSet(${workoutId}, ${exId})">+ Подход</button>
                    </td>
                    <td class="calc-kpsh calc-cell">0<span class="trend-container" id="trend-ex-kpsh-${workoutId}-${exId}"></span></td>
                    <td class="calc-oi calc-cell">0<span class="trend-container" id="trend-ex-oi-${workoutId}-${exId}"></span></td>
                    <td class="calc-ot calc-cell">0<span class="trend-container" id="trend-ex-ot-${workoutId}-${exId}"></span></td>
                    <td><input type="text" class="input-ex comment ex-comment" value="${comment}" placeholder="Комментарий..."></td>
                    <td><button class="btn-del" onclick="this.closest('tr').remove(); updateAllCalculations();">x</button></td>
                `;
                newTbody.appendChild(newTr);
                
                const newSetsContainer = newTr.querySelector('.scroll-sets');
                sourceTr.querySelectorAll('.set-block').forEach(sourceSet => {
                    const weight = sourceSet.querySelector('.set-weight').value;
                    const sets = sourceSet.querySelector('.set-sets').value;
                    const reps = sourceSet.querySelector('.set-reps').value;
                    
                    const setDiv = document.createElement('div');
                    setDiv.className = 'set-block set-inactive';
                    setDiv.innerHTML = `
                        <div class="set-col" style="width:100%;">
                            <div class="set-label">Вес</div>
                            <input type="number" class="input-set set-weight" value="${weight}" oninput="updateAllCalculations()">
                        </div>
                        <div class="set-row">
                            <div class="set-col">
                                <div class="set-label">Подх</div>
                                <input type="number" class="input-set set-sets" value="${sets}" oninput="updateAllCalculations()">
                            </div>
                            <div class="set-col">
                                <div class="set-label">Повт</div>
                                <input type="number" class="input-set set-reps" value="${reps}" oninput="updateAllCalculations()">
                            </div>
                        </div>
                        <div class="set-percent">0%</div>
                        <button class="btn-del" style="margin-top:2px; padding:0px 4px;" onclick="this.parentElement.remove(); updateAllCalculations();">x</button>
                    `;
                    newSetsContainer.appendChild(setDiv);
                });
            });
        });
        
        updateAllCalculations();
    }

    function addWorkoutToWeek(weekId) {
        const workoutId = globalWorkoutCounter++;
        const container = document.getElementById(`workouts-container-${weekId}`);
        
        const workoutDiv = document.createElement('div');
        workoutDiv.className = 'workout-block';
        workoutDiv.id = `workout-${workoutId}`;
        
        workoutDiv.innerHTML = `
            <div class="workout-header">
                <input type="text" class="workout-title-input" value="Тренировка ${container.children.length + 1}">
                <button class="btn-del" style="background:#95a5a6;" onclick="this.closest('.workout-block').remove(); updateAllCalculations();">Удалить тренировку</button>
            </div>
            <table class="main-table" id="table-${workoutId}">
                <thead>
                    <tr>
                        <th width="70">УПР</th>
                        <th width="50">ПМ</th>
                        <th>Подходы (Вес / Подх х Повт)</th>
                        <th width="50">КПШ</th>
                        <th width="50">ОИ</th>
                        <th width="50">ОТ</th>
                        <th width="100">Комментарий</th>
                        <th width="20"></th>
                    </tr>
                </thead>
                <tbody class="workout-tbody"></tbody>
                <tfoot>
                    <tr style="font-weight: bold; background-color: #f9f9f9;">
                        <td colspan="3" style="text-align: right; padding-right: 8px; font-size: 10px;">Сумма:</td>
                        <td class="w-t-kpsh calc-cell">0<span class="trend-container" id="trend-w-kpsh-${workoutId}"></span></td>
                        <td class="w-t-oi calc-cell">0<span class="trend-container" id="trend-w-oi-${workoutId}"></span></td>
                        <td class="w-t-ot calc-cell">0<span class="trend-container" id="trend-w-ot-${workoutId}"></span></td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
            <div style="margin-top: 4px;">
                <button class="btn-add-set" onclick="addExerciseRow(${workoutId})">+ Упражнение</button>
            </div>
        `;
        
        container.appendChild(workoutDiv);
        addExerciseRow(workoutId);
        return workoutId;
    }

    function addExerciseRow(workoutId) {
        const id = globalExCounter++;
        const tbody = document.querySelector(`#table-${workoutId} .workout-tbody`);
        const tr = document.createElement('tr');
        tr.id = `ex-${workoutId}-${id}`;
        tr.innerHTML = `
            <td><input type="text" class="input-ex ex-name" placeholder="Название" oninput="onExNameChange(${workoutId}, ${id})"></td>
            <td><input type="number" class="input-ex ex-pm" placeholder="ПМ" oninput="updateAllCalculations()"></td>
            <td>
                <div class="scroll-sets" id="sets-container-${workoutId}-${id}"></div>
                <button class="btn-add-set" style="margin-top:2px;" onclick="addSet(${workoutId}, ${id})">+ Подход</button>
            </td>
            <td class="calc-kpsh calc-cell">0<span class="trend-container" id="trend-ex-kpsh-${workoutId}-${id}"></span></td>
            <td class="calc-oi calc-cell">0<span class="trend-container" id="trend-ex-oi-${workoutId}-${id}"></span></td>
            <td class="calc-ot calc-cell">0<span class="trend-container" id="trend-ex-ot-${workoutId}-${id}"></span></td>
            <td><input type="text" class="input-ex comment ex-comment" placeholder="Комментарий..."></td>
            <td><button class="btn-del" onclick="this.closest('tr').remove(); updateAllCalculations();">x</button></td>
        `;
        tbody.appendChild(tr);
        addSet(workoutId, id);
        return id;
    }

    function onExNameChange(workoutId, id) {
        const row = document.getElementById(`ex-${workoutId}-${id}`);
        const nameInput = row.querySelector('.ex-name');
        const pmInput = row.querySelector('.ex-pm');
        const pmData = getPmData();
        
        const name = nameInput.value.trim();
        if (pmData[name] !== undefined) {
            pmInput.value = pmData[name];
        }
        updateAllCalculations();
    }

    function addSet(workoutId, exId, weightVal = '', setsVal = '', repsVal = '') {
        const container = document.getElementById(`sets-container-${workoutId}-${exId}`);
        const setDiv = document.createElement('div');
        setDiv.className = 'set-block set-inactive';
        setDiv.innerHTML = `
            <div class="set-col" style="width:100%;">
                <div class="set-label">Вес</div>
                <input type="number" class="input-set set-weight" value="${weightVal}" oninput="updateAllCalculations()">
            </div>
            <div class="set-row">
                <div class="set-col">
                    <div class="set-label">Подх</div>
                    <input type="number" class="input-set set-sets" value="${setsVal}" oninput="updateAllCalculations()">
                </div>
                <div class="set-col">
                    <div class="set-label">Повт</div>
                    <input type="number" class="input-set set-reps" value="${repsVal}" oninput="updateAllCalculations()">
                </div>
            </div>
            <div class="set-percent">0%</div>
            <button class="btn-del" style="margin-top:2px; padding:0px 4px;" onclick="this.parentElement.remove(); updateAllCalculations();">x</button>
        `;
        container.appendChild(setDiv);
        updateAllCalculations();
    }

    // --- ГЛОБАЛЬНАЯ МАТЕМАТИКА ---
    function updateAllCalculations() {
        document.querySelectorAll('.week-block').forEach(weekBlock => {
            let weekKpsh = 0;
            let weekOt = 0;

            weekBlock.querySelectorAll('.workout-block').forEach(workoutBlock => {
                const workoutId = workoutBlock.id.split('-')[1];
                let workoutKpsh = 0;
                let workoutOt = 0;

                workoutBlock.querySelectorAll('tbody tr').forEach(tr => {
                    const pm = parseFloat(tr.querySelector('.ex-pm').value) || 0;
                    let exKpsh = 0;
                    let exOt = 0;

                    tr.querySelectorAll('.set-block').forEach(setBlock => {
                        const weight = parseFloat(setBlock.querySelector('.set-weight').value) || 0;
                        const sets = parseFloat(setBlock.querySelector('.set-sets').value) || 0;
                        const reps = parseFloat(setBlock.querySelector('.set-reps').value) || 0;
                        const percentDisplay = setBlock.querySelector('.set-percent');
                        
                        setBlock.className = 'set-block set-inactive';
                        percentDisplay.className = 'set-percent';
                        
                        if (pm > 0 && weight > 0 && sets > 0 && reps > 0) {
                            const percent = (weight / pm) * 100;
                            percentDisplay.textContent = Math.round(percent) + '%';

                            if (percent >= 50) {
                                if (percent >= 95) setBlock.classList.add('set-black');
                                else if (percent >= 85) setBlock.classList.add('set-red');
                                else if (percent >= 70) setBlock.classList.add('set-yellow');
                                else setBlock.classList.add('set-green');
                                
                                setBlock.classList.remove('set-inactive');
                                const totalReps = sets * reps;
                                exKpsh += totalReps;
                                exOt += (totalReps * percent);
                            }
                        } else {
                            percentDisplay.textContent = '0%';
                        }
                    });

                    const dispExKpsh = Math.round(exKpsh);
                    const dispExOt = Math.round(exOt);
                    const exOi = exKpsh > 0 ? (exOt / exKpsh) : 0;
                    const dispExOi = parseFloat(exOi.toFixed(1));

                    tr.querySelector('.calc-kpsh').innerHTML = `${dispExKpsh}<span class="trend-container" id="trend-ex-kpsh-${workoutId}-${tr.id.split('-')[2]}"></span>`;
                    tr.querySelector('.calc-ot').innerHTML = `${dispExOt}<span class="trend-container" id="trend-ex-ot-${workoutId}-${tr.id.split('-')[2]}"></span>`;
                    tr.querySelector('.calc-oi').innerHTML = `${dispExOi}<span class="trend-container" id="trend-ex-oi-${workoutId}-${tr.id.split('-')[2]}"></span>`;

                    const parentExId = tr.dataset.parentExId;
                    if (parentExId) {
                        const parentTr = document.getElementById(`ex-${workoutBlock.dataset.parentWorkoutId}-${parentExId}`);
                        if (parentTr && parentTr.querySelector('.calc-kpsh')) {
                            const pKpsh = parseFloat(parentTr.querySelector('.calc-kpsh').textContent) || 0;
                            const pOt = parseFloat(parentTr.querySelector('.calc-ot').textContent) || 0;
                            const pOi = parseFloat(parentTr.querySelector('.calc-oi').textContent) || 0;
                            
                            setTrend(`trend-ex-kpsh-${workoutId}-${tr.id.split('-')[2]}`, dispExKpsh, pKpsh);
                            setTrend(`trend-ex-ot-${workoutId}-${tr.id.split('-')[2]}`, dispExOt, pOt);
                            setTrend(`trend-ex-oi-${workoutId}-${tr.id.split('-')[2]}`, dispExOi, pOi, true);
                        }
                    }

                    workoutKpsh += exKpsh;
                    workoutOt += exOt;
                });

                const dispWKpsh = Math.round(workoutKpsh);
                const dispWOt = Math.round(workoutOt);
                const workoutOi = workoutKpsh > 0 ? (workoutOt / workoutKpsh) : 0;
                const dispWOi = parseFloat(workoutOi.toFixed(1));

                workoutBlock.querySelector('.w-t-kpsh').innerHTML = `${dispWKpsh}<span class="trend-container" id="trend-w-kpsh-${workoutId}"></span>`;
                workoutBlock.querySelector('.w-t-ot').innerHTML = `${dispWOt}<span class="trend-container" id="trend-w-ot-${workoutId}"></span>`;
                workoutBlock.querySelector('.w-t-oi').innerHTML = `${dispWOi}<span class="trend-container" id="trend-w-oi-${workoutId}"></span>`;

                const parentWorkoutId = workoutBlock.dataset.parentWorkoutId;
                if (parentWorkoutId) {
                    const parentWorkout = document.getElementById(`workout-${parentWorkoutId}`);
                    if (parentWorkout && parentWorkout.querySelector('.w-t-kpsh')) {
                        const pWKpsh = parseFloat(parentWorkout.querySelector('.w-t-kpsh').textContent) || 0;
                        const pWOt = parseFloat(parentWorkout.querySelector('.w-t-ot').textContent) || 0;
                        const pWOi = parseFloat(parentWorkout.querySelector('.w-t-oi').textContent) || 0;
                        
                        setTrend(`trend-w-kpsh-${workoutId}`, dispWKpsh, pWKpsh);
                        setTrend(`trend-w-ot-${workoutId}`, dispWOt, pWOt);
                        setTrend(`trend-w-oi-${workoutId}`, dispWOi, pWOi, true);
                    }
                }

                weekKpsh += workoutKpsh;
                weekOt += workoutOt;
            });

            const dispKpsh = Math.round(weekKpsh);
            const dispOt = Math.round(weekOt);
            const weekOi = weekKpsh > 0 ? (weekOt / weekKpsh) : 0;
            const dispOi = parseFloat(weekOi.toFixed(1));

            weekBlock.querySelector('.w-kpsh').innerHTML = `${dispKpsh}<span class="trend-container" id="trend-kpsh-${weekBlock.id.split('-')[1]}"></span>`;
            weekBlock.querySelector('.w-ot').innerHTML = `${dispOt}<span class="trend-container" id="trend-ot-${weekBlock.id.split('-')[1]}"></span>`;
            weekBlock.querySelector('.w-oi').innerHTML = `${dispOi}<span class="trend-container" id="trend-oi-${weekBlock.id.split('-')[1]}"></span>`;

            const parentId = weekBlock.dataset.parentId;
            if (parentId) {
                const parentBlock = document.getElementById(`week-${parentId}`);
                if (parentBlock) {
                    const pKpsh = parseFloat(parentBlock.querySelector('.w-kpsh').textContent) || 0;
                    const pOt = parseFloat(parentBlock.querySelector('.w-ot').textContent) || 0;
                    const pOi = parseFloat(parentBlock.querySelector('.w-oi').textContent) || 0;

                    setTrend(`trend-kpsh-${weekBlock.id.split('-')[1]}`, dispKpsh, pKpsh);
                    setTrend(`trend-ot-${weekBlock.id.split('-')[1]}`, dispOt, pOt);
                    setTrend(`trend-oi-${weekBlock.id.split('-')[1]}`, dispOi, pOi, true);
                }
            }
        });
    }

    function setTrend(elementId, current, parent, isOi = false) {
        const el = document.getElementById(elementId);
        if (!el) return;
        
        const diff = current - parent;
        
        if (Math.abs(diff) < 0.1) {
            el.innerHTML = '';
            return;
        }

        const isUp = diff > 0;
        const colorClass = isUp ? 'trend-up' : 'trend-down';
        const arrow = isUp ? '▲' : '▼';
        const sign = isUp ? '+' : '';
        const diffText = isOi ? diff.toFixed(1) : Math.round(diff);

        el.innerHTML = `<span class="trend-indicator ${colorClass}" title="Разница: ${sign}${diffText}">${arrow}</span>`;
    }

    // Инициализация
    window.onload = () => {
        const isLoaded = loadState();
        if (!isLoaded) {
            addPmRow(); addPmRow(); addPmRow();
            showTimelinePlaceholder();
            addNewCycle();
        }
    };
</script>
